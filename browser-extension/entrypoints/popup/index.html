<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- WXT uses this as the toolbar tooltip (action.default_title). -->
    <title>Find feeds on this page</title>
  </head>
  <body>
    <header class="top">
      <img src="/icon/32.png" width="24" height="24" alt="" />

        <strong>FeedBridge</strong>
        <span id="page-host" class="muted"></span>
      </div>

    <script type="module" src="./main.ts"></script>
